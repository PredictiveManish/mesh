[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-train"
version = "0.1.0"
description = "Coordination layer for distributed training on volunteer hardware"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["torch>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mesh = "mesh.cli:main"

[tool.setuptools.packages.find]
include = ["mesh*"]
